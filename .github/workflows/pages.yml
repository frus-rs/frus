name: Pages

# The widget gallery (`frus-examples/widgets`), built for the Web and published on GitHub
# Pages: https://frus-rs.github.io/frus/
#
# The site is the `gh-pages` branch, rewritten as a single commit on every run so ten
# megabytes of wasm per push do not pile up in its history.

on:
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "frus-examples/widgets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gallery:
    name: Widget gallery
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frus-examples/widgets
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frus-examples/widgets

      # The CLI must be the exact version of the `wasm-bindgen` crate in the lock file,
      # or the glue it writes does not match the module.
      - name: wasm-bindgen version
        id: bindgen
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

      # The site is built the way an application's is, with `frus build web`: the release
      # build, the JavaScript glue, and the gallery's text written into the page for search
      # engines and link previews, read from the page run in the runner's Chrome with no
      # window (it draws with the software renderer: the runner has no GPU). The command line
      # is this checkout's; it has no dependencies, and builds in seconds.
      - name: The frus command line
        working-directory: .
        run: cargo build --release --locked -p frus-cli

      - name: Build the site
        run: |
          "$GITHUB_WORKSPACE/target/release/frus" build web 2>&1 | tee "$RUNNER_TEMP/build.log"
          test "${PIPESTATUS[0]}" = 0
          # Without its text the site still works; say so on the run rather than fail it.
          if ! grep -q "frus:page-text" target/frus-web/widgets/index.html; then
            echo "::warning::the gallery's text was not written into its page (see the build's output)"
          fi

      - name: Publish to gh-pages
        run: |
          cp -r target/frus-web/widgets "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/site"
          # Served as is, not through Jekyll.
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Widget gallery from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
