[package]
name = "frus-background-example"
description = "frus — a job that runs with the application closed, and the application showing its result"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# An example application, never a crate someone depends on.
publish = false

# Library: `rlib` for the desktop binary, `cdylib` (the `.so`) for Android.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# `notifications`: the job posts one on the desktop when it is done (Android needs no feature).
frus = { path = "../frus", features = ["notifications"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

# --- Android packaging (cargo-apk) ---
[package.metadata.android]
package = "com.frus.background"
build_targets = ["aarch64-linux-android"]
resources = "res"

[package.metadata.android.application]
label = "frus background"
# A notification shows the application's icon, and Android refuses one from an application
# without any.
icon = "@mipmap/ic_launcher"
theme = "@style/LaunchTheme"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode|mcc|mnc|touchscreen|navigation|colorMode|fontWeightAdjustment|grammaticalGender"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.func_name"
value = "frus_native_activity_on_create"

# The job's notification (Android 13 and later ask the person, from the window).
[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

# Written by frus: Android refuses, without asking, a permission its manifest does not name.
[[package.metadata.android.uses_permission]]
name = "android.permission.VIBRATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
