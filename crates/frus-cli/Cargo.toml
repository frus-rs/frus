[package]
name = "frus-cli"
description = "frus — the command-line tool: create an application, run it on any device with its log in the terminal, build what you ship"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["gui", "ui", "cli", "template", "cross-platform"]
categories = ["command-line-utilities", "development-tools", "gui"]
# Named, not left to cargo's default, which skips files whose name starts with a dot below the
# package's root: the template's `.gitignore` and `.github/` would be missing from the published
# crate, and `include_bytes!` would not compile.
include = ["/Cargo.toml", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/NOTICE", "/src/**", "/assets/**", "/java/**", "/template/**", "/template-package/**", "/template-plugin/**"]

# `cargo install frus-cli` installs a program called `frus`.
#
# Not documented: the facade crate is called `frus` too, and two targets of one name write the
# same `target/doc/frus/`, the binary's over the library's.
[[bin]]
name = "frus"
path = "src/main.rs"
doc = false

# Few dependencies, on purpose: a tool installed with `cargo install` is compiled on the
# developer's machine, and nearly everything it does fits in the standard library.
[dependencies]
# Cutting fonts down to the characters an application shows (milestone 823): the font subsetter
# of the fontations project, which keeps what a shaper needs (the substitutions a script's letters
# reach, positioning, variable axes). Pure Rust; the one thing here worth not writing again.
skera = "0.10"
# The font types skera's interface is written in, at the version it uses.
read-fonts = { version = "0.47", default-features = false, features = ["std"] }

# The terminal workbench bare `frus` opens (milestone 846): ratatui and crossterm, behind the
# default feature `workbench`. `cargo install frus-cli --no-default-features` leaves it out, and
# bare `frus` then prints the usage. A tool's dependency: applications never see it.
frus-tui = { path = "../frus-tui", version = "0.6", optional = true }

[features]
default = ["workbench"]
workbench = ["dep:frus-tui"]

# For the tests only, and left out when published: the simulated devices listed here are
# checked against the core's own list, which the shell simulates.
[dev-dependencies]
frus-core = { path = "../frus-core" }
