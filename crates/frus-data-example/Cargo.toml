[package]
name = "frus-data-example"
description = "frus — network images with a disk cache, a SQLite database and an OAuth sign-in, in one example"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# An example application, never a crate someone depends on.
publish = false

# Library: `rlib` for the desktop binary, `cdylib` (the `.so`) for Android.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# One dependency: `net` for the images, `sqlite` for the notes, `auth` for the sign-in, and
# `secure-store` to keep the refresh token.
frus = { path = "../frus", features = ["net", "sqlite", "auth", "secure-store", "notifications"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

# --- Android packaging (cargo-apk) ---
[package.metadata.android]
package = "com.frus.data"
build_targets = ["aarch64-linux-android"]
resources = "res"

[package.metadata.android.application]
label = "frus data"
# The frus logo, as `frus create` ships it: a notification shows the application's icon, and
# Android refuses one from an application without any.
icon = "@mipmap/ic_launcher"
theme = "@style/LaunchTheme"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode|mcc|mnc|touchscreen|navigation|colorMode|fontWeightAdjustment|grammaticalGender"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.func_name"
value = "frus_native_activity_on_create"

# The sign-in's redirect, `com.frus.data:/callback`, and links such as `com.frus.data://notes`
# (milestone 801): the application's own scheme.
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"]
data = [{ scheme = "com.frus.data" }]

# Text shared from another application's share sheet becomes a note (milestone 801).
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.SEND"]
categories = ["android.intent.category.DEFAULT"]
data = [{ mime_type = "text/plain" }]

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

# Written by frus: Android refuses, without asking, a permission its manifest does not name.
[[package.metadata.android.uses_permission]]
name = "android.permission.VIBRATE"
