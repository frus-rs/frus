[package]
name = "frus-macros"
description = "frus — compile-time macros: fonts embedded to be cut down, typed translations, typed routes"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/frus-macros"
keywords = ["gui", "fonts", "l10n", "routes", "macro"]
categories = ["gui", "text-processing"]

[lib]
proc-macro = true

[dependencies]
# Reading the `.ftl` files at compile time, with the parser the runtime bundles use, so the
# two can never disagree about what a file says.
fluent-syntax = "0.12"
# The typed routes' derive and the messages' arguments.
proc-macro2 = "1"
quote = "1"
syn = "2"
