[package]
name = "frus-svg"
description = "frus — SVG pictures drawn as the framework's own vector paths"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/frus-svg"
keywords = ["svg", "vector", "gui"]
categories = ["graphics", "gui"]

[dependencies]
frus-core = { path = "../frus-core", version = "0.6" }
frus-image = { path = "../frus-image", version = "0.6" }
# `<text>` is laid out and outlined by frus's own text stack (text.rs).
frus-text = { path = "../frus-text", version = "0.6" }
usvg.workspace = true
# The style sheets a `<text>` takes its font from; already the parser's.
simplecss = "0.2"
