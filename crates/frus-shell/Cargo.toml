[package]
name = "frus-shell"
description = "frus — the platform layer: window + event loop (Milestone 0)"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/frus-shell"
keywords = ["gui", "winit", "window", "event-loop", "wasm"]
categories = ["gui", "wasm"]

# The `net` feature turns on the cross-platform `fetch` HTTP helper: the `ureq`
# client natively, the browser's `fetch` on the Web. Off by default, so an app that
# does no networking bundles neither ureq nor its TLS stack.
# The `json` feature, which implies `net`, adds `Request::json_body` / `send_json`
# through serde.
#
# The `bundled-*` features forward the **bundled fonts** (milestone 292): they are
# ~3.4 MB of faces, and an application that ships its own turns off the ones it does
# not need. All on by default.
[features]
# Web views (milestone 799): the shell's side of `WebViewController`. Off by default.
webview = ["frus-widgets/webview"]
# A driver with no window, for an application's tests to feed input and frames through the
# shell's own paths. Hidden; not for applications to ship.
testing = []
# Hot reload under `frus run`: connects to the patch server it starts, applies each patch, and
# rebuilds the interface. Development only; `frus run` turns it on.
hot-reload = ["dep:dioxus-devtools", "dep:serde_json", "frus-widgets/hot-reload"]
# The system's file dialogs: `FileDialog` (milestone 698). Desktop only; off by default, as it
# brings the desktop portal's D-Bus client on Linux.
file-dialogs = ["dep:rfd"]
# The system's notifications: `SystemNotification` (milestones 701 to 704). The desktop,
# Android and the Web; off by default, as it brings the D-Bus client on Linux and the toast
# bindings on Windows.
notifications = ["dep:notify-rust"]
# The tray icon: `Tray` (milestone 706). The desktop; off by default. On Linux it needs GTK 3's
# development files to build (`libgtk-3-dev`), the menus being made with it.
tray = ["dep:tray-icon"]
# The taskbar's badge and progress: `Taskbar` (milestone 708). The desktop; off by default.
taskbar = ["dep:objc2-app-kit", "dep:zbus"]
# Global shortcuts: `GlobalShortcut` (milestone 709). The desktop (X11 on Linux); off by default.
global-shortcuts = ["dep:global-hotkey"]
# Secrets kept by the system: `SecureStore` (milestone 776). Windows' Credential Manager, the
# Keychain on macOS and iOS, the Secret Service on Linux, the Android Keystore. Off by default,
# as it brings the Secret Service's D-Bus client on Linux and Security.framework's bindings on
# Apple systems.
secure-store = ["dep:security-framework", "dep:secret-service"]
net = ["dep:ureq"]
json = ["net", "dep:serde", "dep:serde_json"]
# A SQLite database in the application's data folder: `database()` (milestone 795). Off by
# default: SQLite is compiled in (rusqlite's `bundled`), about a megabyte of native code.
# The Web has none; `open` answers `Unsupported` there.
sqlite = ["dep:rusqlite", "dep:async-channel"]
# Signing in through the system's browser, OAuth 2 / OpenID Connect with PKCE:
# `auth_session()` (milestone 795). Off by default. The hashing and the random bytes come
# from `ring`, already in the tree through the `net` feature's TLS.
auth = ["json", "dep:ring", "dep:async-channel", "web-sys/Crypto", "web-sys/SubtleCrypto"]
# The camera (milestone 798): `CameraController`, `CameraPreview`. Android needs nothing more
# (Camera2 is reached through `dlsym`); Windows uses Media Foundation (the `windows` crate's
# bindings, already in the tree) and encodes its pictures with `image` (already in the tree
# through frus-image); the Web uses `getUserMedia`. Off by default.
camera = [
    "dep:image",
    "windows/Win32_Media_MediaFoundation",
    "windows/Win32_System_Com_StructuredStorage",
    "windows/Win32_System_Variant",
    "web-sys/CanvasRenderingContext2d",
    "web-sys/HtmlVideoElement",
    "web-sys/HtmlMediaElement",
    "web-sys/ImageData",
    "web-sys/MediaDeviceInfo",
    "web-sys/MediaDeviceKind",
    "web-sys/MediaDevices",
    "web-sys/MediaStream",
    "web-sys/MediaStreamConstraints",
    "web-sys/MediaStreamTrack",
]
# Reading QR codes from the camera: `Scanner` (milestone 798). rxing, pure Rust; its QR reader
# alone is about 0.5 MB of a release build.
scanner = ["camera", "dep:rxing", "dep:async-channel"]
# Every format rxing reads: EAN, UPC, Code 128, Data Matrix, PDF417, Aztec...
scanner-all-formats = ["scanner", "rxing/full_barcode_format_support"]
# Video playback: `VideoPlayerController`, `VideoPlayer` (milestone 797). Off by default. The
# platform's own player does the work (Android's MediaPlayer, Windows' Media Foundation, the
# browser's <video>), so nothing is compiled in but the bindings.
video = [
    "windows/Win32_Media_MediaFoundation",
    "windows/Win32_Graphics_Imaging",
    "web-sys/HtmlVideoElement",
    "web-sys/HtmlMediaElement",
    "web-sys/MediaError",
    "web-sys/TimeRanges",
    "web-sys/CanvasRenderingContext2d",
    "web-sys/ImageData",
    "web-sys/Url",
]
# A web page inside the page on Windows: `PlatformView::new("frus/webview", ..)` hosted by the
# system's WebView2 (milestone 802). Off by default: the bindings are a few hundred kilobytes,
# and the Edge WebView2 runtime must be on the machine (it ships with Windows 11). Without it,
# a web view shows its fallback on Windows; Android and the web have one with no feature.
webview2 = ["dep:webview2-com"]
default = ["frus-gpu/default", "frus-widgets/default"]
# Android (milestone 800): a `TextureSurface`'s frames shown without a copy where the GPU can
# import hardware buffers (Vulkan). Off by default: an application with no video pays nothing.
hardware-buffers = ["frus-gpu/hardware-buffers"]
# Custom shaders compiled ahead of their first frame (milestone 800). Off by default.
warm-shaders = ["frus-gpu/warm-shaders"]
bundled-sans = ["frus-gpu/bundled-sans", "frus-widgets/bundled-sans"]
bundled-italic = ["frus-gpu/bundled-italic", "frus-widgets/bundled-italic"]
bundled-mono = ["frus-gpu/bundled-mono", "frus-widgets/bundled-mono"]
bundled-arabic = ["frus-gpu/bundled-arabic", "frus-widgets/bundled-arabic"]
dictionary-line-breaks = ["frus-gpu/dictionary-line-breaks", "frus-widgets/dictionary-line-breaks"]

# The `cfg` aliases (`desktop` / `android` / `ios` / `web`) — see `build.rs`. Already
# in the tree, since winit uses it, so nothing extra is downloaded.
[build-dependencies]
cfg_aliases = "0.2"

[dependencies]
# The client of the patch server `frus run` drives (the subsecond protocol).
dioxus-devtools = { version = "0.7", optional = true }
frus-gpu = { path = "../frus-gpu", version = "0.5", default-features = false }
# How long the fonts took to load, for the start-up report (milestone 683).
frus-text = { path = "../frus-text", version = "0.5", default-features = false }
frus-widgets = { path = "../frus-widgets", version = "0.5", default-features = false }
winit.workspace = true
anyhow.workspace = true
log.workspace = true
# Typed JSON for the `fetch` helper (the `json` feature): serialisation and
# deserialisation. Pure Rust, so it holds on all three targets, unlike ureq, which is
# native only.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# A portable monotonic clock: `std::time` natively, `performance.now()` on the Web,
# where `std::time::Instant` panics. One API for all three platforms.
web-time = "1"
# A one-shot answer from another thread (features `sqlite` and `auth`). Already in the tree,
# through `blocking`.
async-channel = { version = "2", optional = true }
# The code reader (feature `scanner`, milestone 798): QR codes, and every other format with
# `scanner-all-formats`. Pure Rust (Apache-2.0), no system library; its image decoders, its
# writers and its date and address parsing are left out (frus hands it brightness).
rxing = { version = "0.9", optional = true, default-features = false, features = ["decoders", "encoding_rs", "qrcode"] }

# Native (desktop + Android): a blocking wait on GPU init. The Web is asynchronous
# instead — see `run_web`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true
# The async runtime (see `src/runtime.rs`). `async-executor` is the scheduler and
# `async-io` the reactor — the part that was missing, and without which a future that
# waits on a timer or a socket simply never wakes up. Both are small, pure Rust and
# free of proc macros; between them they are what lets a `Command` be a real future
# rather than a blocking call wearing a future's clothes.
async-executor = "1"
async-io = "2"
futures-lite = "2"
# Moving a **blocking** call off the executor and onto a pool sized for waiting. The
# `net` feature's client is blocking, and a blocking call on a four-worker executor
# is how you starve every other effect in the application.
blocking = "1"
# The image downloads' slots (milestone 795): at most six at a time. Already in the tree,
# through `async-io`.
async-lock = "3"
# The `fetch` helper's native HTTP client (the `net` feature): blocking, driven to
# completion inside the async future's body, on its own thread. TLS through rustls,
# ureq's default.
ureq = { version = "3", optional = true }
# SQLite (feature `sqlite`): compiled from its amalgamation by `bundled`, so every platform
# has the same version and nothing is to be installed.
rusqlite = { version = "0.41", optional = true, features = ["bundled"] }
# The sign-in's hashing and random bytes (feature `auth`): the TLS stack's own crate.
ring = { version = "0.17", optional = true }

# The reader's preferred languages, everywhere but Android and the Web — Windows,
# macOS, Linux and iOS each keep them somewhere different, and this is one small crate
# over the four. It is **already in the tree**: cosmic-text pulls it, so naming it here
# adds no dependency at all. Android has a better answer (the activity's `Configuration`,
# read over the JNI walk that is already there) and the Web has its own.
[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
sys-locale = "0.3"

# Desktop only — not Android, not iOS, not the Web: clipboard, console logger and
# accessibility. (AccessKit exposes the semantic tree to the native screen readers —
# UIA on Windows, AT-SPI on Linux, macOS; the Android and Web providers are separate.)
#
# iOS is excluded explicitly: `arboard`, a desktop clipboard, and `accesskit_winit`
# have no UIKit backend, and stderr is not readable on a device. Cargo does not
# evaluate `build.rs` aliases here, hence the list spelled out in full.
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
# Decodes the application's icon for the window (`AppIcon`); already in the tree through the
# widgets' `images` feature.
frus-image = { path = "../frus-image", version = "0.5" }
arboard.workspace = true
env_logger.workspace = true
accesskit = "0.25"
accesskit_winit = "0.34"
# The system's file dialogs (feature `file-dialogs`): the Windows and macOS dialogs, and the
# desktop portal on Linux, which needs no system library to build against.
rfd = { version = "0.17.2", optional = true }
# The system's notifications (feature `notifications`): Windows toasts, macOS notifications,
# and the desktop's notification server over D-Bus on Linux, in pure Rust.
notify-rust = { version = "4.18.2", optional = true }
# The tray icon (feature `tray`): the notification area on Windows, the menu bar on macOS, and
# the desktop's status area over D-Bus on Linux (below, with its `ksni` feature).
tray-icon = { version = "0.26.1", optional = true, default-features = false }
# Global shortcuts (feature `global-shortcuts`): RegisterHotKey on Windows, the Carbon hot keys on
# macOS, a key grab on X11 — pure Rust everywhere, no system library to build against.
global-hotkey = { version = "0.9.0", optional = true }

# Web (wasm32 + WebGPU): the browser entry point, JS futures, console logs.
# The application's content on the title bar's line (milestone 640): the frame and the
# window procedure, which winit does not reach. Already in the tree.
# The tray icon on Linux and the BSDs: the desktop's status area through D-Bus (`ksni`), not the
# older indicator library a desktop may not have.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android", target_os = "ios"))))'.dependencies]
tray-icon = { version = "0.26.1", optional = true, default-features = false, features = ["ksni"] }

# The secure store (feature `secure-store`) on Linux: the desktop's Secret Service over D-Bus
# (GNOME Keyring, KWallet), in pure Rust, its session encrypted with pure-Rust crypto.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android", target_os = "ios"))))'.dependencies.secret-service]
version = "5.2"
optional = true
features = ["rt-async-io-crypto-rust"]

# The taskbar (feature `taskbar`) on Linux: the launcher entry signal, over D-Bus.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android", target_os = "ios"))))'.dependencies.zbus]
version = "6"
optional = true

# The permissions on macOS, always; the taskbar (feature `taskbar`): the Dock tile's badge.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString", "NSURL"] }

# The secure store (feature `secure-store`) on macOS and iOS: the Keychain's generic passwords.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = { version = "3", optional = true, default-features = false }

[target.'cfg(windows)'.dependencies]
# The camera's pictures on Windows (feature `camera`): the latest frame, encoded as JPEG.
# Already in the tree through frus-image.
image = { workspace = true, optional = true }
# The taskbar (feature `taskbar`): its button's progress and overlay, a COM interface the raw
# bindings below do not carry; the system's share window (milestone 775), a WinRT interface;
# and the connectivity (milestone 777): the connection profile Windows uses for the internet,
# and its network events. Already in the tree through the tray and the notifications.
windows = { version = "0.62", features = ["ApplicationModel_DataTransfer", "Foundation", "Networking_Connectivity", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# The share window's list of files, and waiting for a file to be found (milestone 775).
windows-collections = "0.3"
# The media engine's callback (feature `video`, milestone 797): `#[implement]` names this crate.
# Already in the tree, through `windows`.
windows-core = "0.62"
# The web view on Windows (feature `webview2`, milestone 802): the WebView2 COM interfaces, over
# the same `windows` crate as above.
webview2-com = { version = "0.39", optional = true }
windows-future = "0.3"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # The secure store (milestone 776): the Credential Manager's generic credentials.
    "Win32_Security_Credentials",
    # A picture of a native view under a dialog (milestone 802): `PrintWindow`.
    "Win32_Storage_Xps",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    # The process's creation time, for the start-up report (milestone 683).
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# `Uint8Array`: reading a response body as bytes rather than as text (milestone 373).
js-sys = "0.3"
console_error_panic_hook = "0.1"
# `Request`/`RequestInit`/`Headers`/`Abort*`: the `fetch` HTTP helper (`net`) on the Web.
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    # `navigator.languages`: the reader's preferred languages, in order (milestone 454).
    "Navigator",
    # `navigator.clipboard`: copy and paste (milestone 526, #17).
    "Clipboard",
    # The address bar and the browser history (deep links): `location`, `history`, the base URL
    # of the document and the `popstate` listener.
    "History",
    "Location",
    "Url",
    # The tab's session storage: the component states a reload under `frus run` keeps.
    "Storage",
    "Node",
    "Event",
    "EventTarget",
    # The bridge's buttons stop an Enter or a Space from reaching the shell as a key (#23).
    "KeyboardEvent",
    # The tab's icon: the PNG becomes a Blob, and its object URL the icon link's address.
    "Blob",
    "BlobPropertyBag",
    "Element",
    "Response",
    "Request",
    "RequestInit",
    "Headers",
    "AbortController",
    "AbortSignal",
    # The page's notifications (milestone 704): `SystemNotification` on the Web.
    "Notification",
    "NotificationOptions",
    "NotificationPermission",
    # The accessibility bridge (milestone 564, #18): the canvas winit attached the
    # window to, and the element type its fallback-content nodes are built as.
    "HtmlCanvasElement",
    "HtmlElement",
    # The element a text field is edited through (milestone 711): the two kinds, the keys it
    # hands to the canvas, a composition's text, and where the canvas is on the page.
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "KeyboardEventInit",
    "CompositionEvent",
    # A press on the canvas, which winit focuses, must not blur the field being typed into
    # on a touch screen: the keyboard would go with it (milestone 750).
    "FocusEvent",
    "DomRect",
    # The browser's console, a method per log level (milestone 604).
    "console",
    # The page's clock, which counts from the navigation (milestone 683).
    "Performance",
    # A page that cannot draw says so (milestone 745): the event the page listens to.
    "CustomEvent",
    "CustomEventInit",
    # The page's background follows the application's (milestone 749): Chrome on Android
    # paints the phone's navigation bar with it.
    "CssStyleDeclaration",
    # The on-screen keyboard, measured as what the visual viewport leaves out (milestone 749).
    "VisualViewport",
    # Whether the page is used with a finger, for where the editing element may sit.
    "MediaQueryList",
    # A page that pans for the keyboard brings the field being edited into sight (milestone
    # 770).
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    # Native views over the canvas (milestone 802): a page in a frame, a video.
    "HtmlIFrameElement",
    "HtmlMediaElement",
    "HtmlVideoElement",
] }

# On Android, winit goes through the native activity (android-activity) and the logs
# land in logcat.
[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
# Without its default `regex` feature (milestone 803): the filter frus gives it is
# `level,crate=level,…` and never a `/pattern`, and the regex engine that only a pattern
# needs was about 450 KB of every application's library.
android_logger = { version = "0.14", default-features = false }
# The input bridge (InputConnection): loading the bundled dex plus its natives.
jni = "0.21"
# The Java VM a texture surface's `android.view.Surface` is made in (milestone 793); already
# in the tree through winit.
ndk-context = "0.1"

# The animation speed is process-wide, so its test is a binary of its own; it drives the
# windowless driver, hence the feature.
[[test]]
name = "animation_speed"
required-features = ["testing"]
