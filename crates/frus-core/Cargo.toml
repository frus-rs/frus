[package]
name = "frus-core"
description = "frus — shared foundation types (geometry, colour)"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/frus-core"
keywords = ["gui", "geometry", "colour", "wgpu"]
categories = ["gui", "graphics"]

[features]
# Shader pipelines compiled ahead of their first frame (milestone 800): the loaded shaders are
# listed for the renderer. Off by default; `frus`'s `warm-shaders` turns it on.
warm-shaders = []

[dependencies]
bytemuck.workspace = true
# An invalid OpenType tag or language tag in a text style is ignored, and the console is told.
log.workspace = true
# Custom fragment shaders (milestone 792): their WGSL is parsed, validated and its uniform
# block read when the shader is made, so an error is said with its line before anything is
# drawn. The same naga, with the same feature, that wgpu already builds in.
naga = { version = "30", features = ["wgsl-in"] }
